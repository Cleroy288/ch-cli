[package]
name = "rustean"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["bracketed-paste"] }

# Tree-sitter indexer
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
thiserror = "2.0"
streaming-iterator = "0.1"

# File crawling and parallel processing
rayon = "1.10"
ignore = "0.4"

# Tantivy search engine
tantivy = "0.22"

# Semantic graph (fxhash for fast hashing)
fxhash = "0.2"
clap = { version = "4.5.55", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
notify = { version = "8.2.0", features = ["macos_fsevent"] }

# HTTP client (Atlassian API)
reqwest = { version = "0.12", features = ["blocking", "json"] }
percent-encoding = "2"

# Syntax highlighting (code blocks in TUI)
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# Inline code editor (review mode)
tui-textarea-2 = { version = "0.10", features = ["crossterm"] }

# Centralized data storage
blake3 = "1"
dirs = "6"

# Utilities
regex = "1.10"
unicode-width = "0.2"
base64 = "0.22"

# ===========================
# RUSTY NORM — Cargo lint activation
# ===========================
# Every lint configured in clippy.toml must be activated
# here. Thresholds live in clippy.toml, activation lives
# here. allow-by-default lints need explicit opt-in.
[lints.clippy]
# Function constraints
too-many-lines = "warn"
cognitive-complexity = "warn"
# Nesting & complexity
excessive-nesting = "warn"
# Naming discipline
many-single-char-names = "warn"
min-ident-chars = "warn"
# Boolean discipline
fn-params-excessive-bools = "warn"
struct-excessive-bools = "warn"
# Test discipline (print/dbg forbidden outside tests)
dbg-macro = "warn"
print-stdout = "warn"
print-stderr = "warn"
# Idiomatic Rust

[dev-dependencies]
tempfile = "3.24.0"
criterion = { version = "0.5", features = ["html_reports"] }
