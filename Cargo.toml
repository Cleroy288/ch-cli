[package]
name = "ch-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.30.0"
crossterm = "0.29"

# Semantic indexer dependencies
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
thiserror = "2.0"
streaming-iterator = "0.1"

# Phase 2: File crawling and parallel processing
rayon = "1.10"
ignore = "0.4"

# Phase 3: Tantivy search engine
tantivy = "0.22"

# Phase 4: Semantic analysis (using fxhash for fast hashing)
fxhash = "0.2"
clap = { version = "4.5.55", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
notify = { version = "8.2.0", features = ["macos_fsevent"] }

# Phase 5: Daemon system for ML models
nix = { version = "0.29", features = ["process", "signal", "fs"] }
interprocess = "2.2"
daemonize = "0.5"
directories = "5.0"

# Phase 6: ML framework (Candle)
# Updated to 0.9 for XLMRobertaForSequenceClassification support
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
hf-hub = "0.4"
tokenizers = "0.20"

# Phase 7: Vector search
instant-distance = "0.6"

# Utilities
half = "2.4"
memmap2 = "0.9"
regex = "1.10"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }

[features]
default = ["cpu"]
cpu = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dev-dependencies]
tempfile = "3.24.0"
criterion = { version = "0.5", features = ["html_reports"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }

